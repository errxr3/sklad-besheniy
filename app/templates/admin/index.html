{% extends "base.html" %}
{% block title %}{{ section.title }}{% endblock %}
{% block content %}
<section class="admin-section {{ section.key }}">
	<h1>{{ section.title }}</h1>
	<div class="grid3">
		{% for url, name, hint in section.links %}
		<a class="card tile" href="{{ url }}"><h3>{{ name }}</h3><p class="muted">{{ hint }}</p></a>
		{% endfor %}
	</div>
</section>
{% endblock %}
