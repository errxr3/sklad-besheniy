{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="login-hero">
	<div class="login-logo">BLAGO</div>
	<p>Склад зеркал</p>
</div>
<div class="card login-card">
	<h1>Вход</h1>
	{% if error %}<p class="msg err">{{ error }}</p>{% endif %}
	<form method="post" action="/login">
		<input type="hidden" name="csrf_token" value="{{ csrf }}">
		<input type="hidden" name="next" value="{{ next_url }}">
		<label for="login">Логин</label>
		<input type="text" name="login" id="login" value="{{ login }}" required maxlength="40"
		       autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" autofocus>
		<label for="password">Пароль</label>
		<input type="password" name="password" id="password" required maxlength="64" autocomplete="current-password">
		<button type="submit" class="big mt">Войти</button>
	</form>
</div>
<div class="login-theme">
	<button type="button" class="secondary small-btn" data-theme-toggle>Светлая / тёмная тема</button>
</div>
{% endblock %}
