# Проверка и выкладка: при каждом обновлении рабочей ветки GitHub прогоняет тесты
# и, если они зелёные, обновляет сервер. Секреты задаются один раз в
# Settings → Secrets and variables → Actions: SERVER_HOST, SERVER_PASSWORD (и SERVER_USER, если не root).
name: Проверка и выкладка

on:
  push:
    branches: [claude/new-session-hm25m6, main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    name: Тесты
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sklad_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Зависимости
        run: pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy app
      - name: pytest
        # Сквозной тест в браузере гоняется отдельно, ему нужен Chromium
        run: pytest -q -m "not browser"

  deploy:
    name: Выкладка на сервер
    needs: test
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.SERVER_HOST }}
      SSHPASS: ${{ secrets.SERVER_PASSWORD }}
      USER_NAME: ${{ secrets.SERVER_USER || 'root' }}
    steps:
      - name: Сервер настроен?
        id: check
        run: |
          if [ -z "$HOST" ] || [ -z "$SSHPASS" ]; then
            echo "Секреты SERVER_HOST и SERVER_PASSWORD не заданы — выкладка пропущена."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - name: Загрузка кода на сервер
        if: steps.check.outputs.ready == 'true'
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          SSH="sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 $USER_NAME@$HOST"
          # .env, бэкапы и база на сервере не трогаются: в архиве их нет
          tar czf - --exclude=.git --exclude=.env --exclude=backups --exclude=.venv . \
            | $SSH "mkdir -p /opt/sklad && tar xzf - -C /opt/sklad"
      - name: Обновление и перезапуск
        if: steps.check.outputs.ready == 'true'
        run: |
          SSH="sshpass -e ssh -o StrictHostKeyChecking=accept-new $USER_NAME@$HOST"
          $SSH 'cd /opt/sklad && test -f .env || { echo "Сервер не установлен: сначала запустите «Первая установка»"; exit 1; }'
          $SSH 'cd /opt/sklad && docker compose up -d --build && docker image prune -f >/dev/null'
          # Caddyfile подключён файлом: после замены Caddy видит новые настройки только после перезапуска
          $SSH 'cd /opt/sklad && if ! cmp -s Caddyfile .caddyfile.deployed; then docker compose restart caddy && cp Caddyfile .caddyfile.deployed; fi'
      - name: Проверка, что сайт отвечает
        if: steps.check.outputs.ready == 'true'
        run: |
          SSH="sshpass -e ssh -o StrictHostKeyChecking=accept-new $USER_NAME@$HOST"
          for i in $(seq 1 40); do
            if $SSH 'cd /opt/sklad && docker compose exec -T app python -c "import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\", timeout=3)"' 2>/dev/null; then
              echo "Сайт отвечает, выкладка завершена"
              exit 0
            fi
            sleep 3
          done
          echo "Приложение не ответило за 2 минуты:"
          $SSH 'cd /opt/sklad && docker compose ps && docker compose logs --tail 80 app'
          exit 1
