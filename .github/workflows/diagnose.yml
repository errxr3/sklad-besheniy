# Проверка сайта снаружи: DNS домена, ответ по HTTP/HTTPS, журнал Caddy (сертификаты).
# Ничего не меняет на сервере. Запуск: Actions → «Проверка сайта» → Run workflow.
name: Проверка сайта

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Домен для проверки"
        required: false
        default: "blagosklad.ru"

jobs:
  check:
    name: Проверка
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.SERVER_HOST }}
      SSHPASS: ${{ secrets.SERVER_PASSWORD }}
      USER_NAME: ${{ secrets.SERVER_USER || 'root' }}
      DOMAIN: ${{ github.event.inputs.domain }}
    steps:
      - name: Проверка введённого домена
        run: |
          if ! [[ "$DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]]; then echo "Домен — только латиница, цифры, точки, дефисы"; exit 1; fi
      - name: DNS домена в мире
        run: |
          sudo apt-get install -y -qq dnsutils sshpass >/dev/null
          for ns in 8.8.8.8 1.1.1.1 77.88.8.8; do
            echo "A через $ns: $(dig +short A "$DOMAIN" @"$ns" | tr '\n' ' ')"
          done
          echo "NS зоны ru для домена:"
          dig +short NS "$DOMAIN" @a.dns.ripn.net || true
          dig +norecurse NS "$DOMAIN" @a.dns.ripn.net | sed -n '/AUTHORITY/,/^$/p' || true
          echo "A у DNS Timeweb:"
          dig +short A "$DOMAIN" @ns1.timeweb.ru || true
      - name: Ответ сайта снаружи
        run: |
          for url in "http://$DOMAIN/health" "https://$DOMAIN/health" "https://89-169-45-92.sslip.io/health"; do
            echo "== $url"
            curl -sS -m 20 -o /dev/null -w "код %{http_code}, IP %{remote_ip}\n" "$url" 2>&1 || true
          done
          echo "== сертификат $DOMAIN"
          echo | timeout 20 openssl s_client -connect "$DOMAIN:443" -servername "$DOMAIN" 2>/dev/null \
            | openssl x509 -noout -subject -issuer -dates 2>/dev/null || echo "сертификата нет"
      - name: Сервер — адрес сайта и журнал Caddy
        if: env.HOST != ''
        run: |
          SSH="sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 $USER_NAME@$HOST"
          $SSH 'cd /opt/sklad && grep "^SITE_ADDRESS=" .env && docker compose ps caddy && docker compose logs --tail 60 caddy 2>&1 | grep -iE "certificate|acme|challenge|error|obtain|domain|tls" | tail -40'
