[project]
name = "sklad-zerkal"
version = "1.0.0"
description = "Веб-система складского учёта зеркал со сканированием и сменами"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["alembic/versions", ".venv", "tools/blago_otgruzki"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "SIM108"]

[tool.mypy]
python_version = "3.12"
plugins = []
strict = false
disallow_untyped_defs = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = "(alembic/versions|tests)"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = ["slow: медленные тесты", "browser: сквозные тесты Playwright"]
filterwarnings = ["ignore::DeprecationWarning"]
